<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bigsip</title>
    <style>
        /* ── Brand palette (sampled from Logo_final_no_background.png) ── */
        :root {
            --bigsip-navy-deep: #0a193f;
            --bigsip-navy-mid:  #3a4d78;
            --bigsip-steel:     #474f5b;
            --bigsip-chrome:    #d2d2d2;
            --bigsip-white:     #ffffff;
            --bigsip-text-muted: #9aa5b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bigsip-navy-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ── Logo: gentle breathing glow, not a spin — feels like it's "warming up" ── */
        .logo-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--bigsip-navy-mid) 0%, transparent 70%);
            filter: blur(12px);
            animation: breathe 2.4s ease-in-out infinite;
        }

        .logo-wrap img {
            position: relative;
            width: 140px;
            height: auto;
            animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(0.96);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.03);
                opacity: 1;
            }
        }

        /* ── Status text + dots ── */
        .status {
            color: var(--bigsip-text-muted);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .dot {
            animation: blink 1.4s infinite;
            opacity: 0;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="splash">
        <div class="logo-wrap">
            <div class="logo-glow"></div>
            <img src="logo.png" alt="bigsip">
        </div>
        <div class="status">
            <span>Starting up</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
    </div>

</body>
</html>
