<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bigsip</title>
    <style>
        :root {
            --bs-navy:      #0d142b;
            --bs-blue-sky:  #4f5e8d;
            --bs-pink-sky:  #db8797;
            --bs-steel:     #9199a8;
            --bs-text:      #d2d8e4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        /* ── Fullscreen Background ── */
        body {
            background-image: url('intro.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background light shimmer */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 75% 25%, var(--bs-pink-sky) 0%, transparent 40%),
                        radial-gradient(circle at 25% 75%, var(--bs-blue-sky) 0%, transparent 40%);
            mix-blend-mode: color-dodge;
            filter: blur(20px);
            opacity: 0.15;
            animation: skyShimmer 10s ease-in-out infinite alternate;
        }

        @keyframes skyShimmer {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.25; transform: scale(1.05); }
        }

        /* ── Central Glass Container ── */
        .glass-ui-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 50px 48px;
            
            background: rgba(13, 20, 43, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(219, 135, 151, 0.08);
            
            animation: introReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes introReveal {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── Logo Container (Scaled Up, Transparent Background) ── */
        .logo-wrap {
            position: relative;
            width: 180px; /* Expands logo to full former box size */
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Soft halo aura behind logo */
        .logo-wrap::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--bs-pink-sky) 0%, transparent 65%);
            mix-blend-mode: soft-light;
            opacity: 0.4;
            animation: haloPulse 3.5s ease-in-out infinite;
        }

        @keyframes haloPulse {
            0%, 100% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        .logo-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Outer drop shadow gives the PNG 3D separation from glass */
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6));
            animation: logoBreathe 3.5s ease-in-out infinite;
        }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(0.97); }
            50% { transform: scale(1.03); }
        }

        .logo-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Metallic Sheen Sweep overlay on logo */
        .logo-img-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                transparent 35%,
                rgba(255, 255, 255, 0.35) 50%,
                transparent 65%
            );
            background-size: 200% 200%;
            mix-blend-mode: overlay;
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 60%, transparent 100%);
            animation: metallicSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes metallicSweep {
            0% { background-position: -150% -150%; }
            30%, 100% { background-position: 150% 150%; }
        }

        /* ── Initializing & Progress Bar ── */
        .initializing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 200px;
        }

        .initializing-status {
            display: flex;
            align-items: baseline;
            gap: 2px;
            color: var(--bs-text);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .initializing-dot {
            animation: dotFade 1.6s infinite;
            opacity: 0;
            color: var(--bs-pink-sky);
        }

        .initializing-dot:nth-child(2) { animation-delay: 0.3s; }
        .initializing-dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotFade {
            0%, 100% { opacity: 0.2; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1a56db 0%, var(--bs-blue-sky) 60%, #ffffff 100%);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            
            animation: loadProgress 8.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards,
                       infiniteShimmer 2s linear infinite 8.5s;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            40% { width: 70%; }
            70% { width: 88%; }
            100% { width: 96%; }
        }

        @keyframes infiniteShimmer {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="glass-ui-container">
        <div class="logo-wrap">
            <div class="logo-img-container">
                <img src="logo.png" alt="bigsip">
            </div>
        </div>
        
        <div class="initializing-container">
            <div class="initializing-status">
                <span>INITIALIZING</span><span class="initializing-dot">.</span><span class="initializing-dot">.</span><span class="initializing-dot">.</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

</body>
</html>
